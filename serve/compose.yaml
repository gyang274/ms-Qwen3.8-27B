# neuron LLM server (SGLang). Model is chosen in .env; switch with /dd/neuron/serve/switch-model.sh
name: neuron
services:
  sglang:
    image: lmsysorg/sglang:v0.5.21-cu130
    container_name: neuron-sglang
    restart: unless-stopped
    ipc: host
    environment:
      # /health answers from the HTTP server without running a 1-token generation. A generating probe every
      # <=30 s keeps an idle Ampere GPU in P2 (~73 W instead of ~8 W) and times out during long prefills.
      # A deep check is still available at /health_generate.
      SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: "false"
    shm_size: 16g
    ports:
      - "30000:30000"
    volumes:
      - /dd/neuron/models:/models:ro
      - /dd/neuron/cache/sglang-root:/root/.cache
      - /dd/neuron/configs/api-key:/run/secrets/api-key:ro
    deploy:
      resources:
        reservations:
          devices:
            # Pinned by UUID: GPU on PCIEX16_2 (chipset Gen3 x4, bus 04:00.0). Decode needs almost no PCIe
            # bandwidth; the CPU Gen4 x16 card (bus 08:00.0, GPU-09aeaae4-...) is left for ComfyUI model swaps.
            - driver: nvidia
              device_ids: ["GPU-a59b6394-c612-21dd-efab-3fa4fb00d4c9"]
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:30000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s
    logging:
      driver: json-file
      options: {max-size: "50m", max-file: "5"}
    # --image-processor-backend pil: image preprocessing on the CPU. The default fast processor resizes images
    # on this GPU, where mem-fraction 0.97 leaves ~20 MiB free, so a screenshot-sized image failed with CUDA OOM
    # (HTTP 500, and every later turn of that conversation too, since the image stays in the history).
    command:
      - bash
      - -c
      - >-
        exec python3 -m sglang.launch_server
        --model-path /models/${NEURON_MODEL}
        --served-model-name ${NEURON_SERVED_NAME}
        --api-key "$$(cat /run/secrets/api-key)"
        --host 0.0.0.0 --port 30000
        --context-length 262144
        --kv-cache-dtype fp8_e4m3
        --mem-fraction-static 0.97
        --chunked-prefill-size 8192
        --max-running-requests 4
        --max-mamba-cache-size 24
        --reasoning-parser qwen3
        --tool-call-parser qwen3_coder
        --speculative-algorithm EAGLE
        --speculative-num-steps 3
        --speculative-eagle-topk 1
        --speculative-num-draft-tokens 4
        --enable-linear-replayssm-spec
        --sleep-on-idle
        --enable-metrics
        --image-processor-backend pil
